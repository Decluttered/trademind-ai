name: Docker Config CI

on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    branches:
      - main
      - dev
    paths:
      - "docker-compose*.yml"
      - ".env.example"
      - "**/Dockerfile"
      - "**/.dockerignore"
      - ".github/workflows/docker.yml"
  push:
    branches:
      - main
      - dev
      - "feat/**"
      - "fix/**"
      - "release/**"
    paths:
      - "docker-compose*.yml"
      - ".env.example"
      - "**/Dockerfile"
      - "**/.dockerignore"
      - ".github/workflows/docker.yml"

jobs:
  compose-config:
    name: docker compose config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare env file
        run: cp .env.example .env

      - name: Validate full compose file
        env:
          # Compose interpolation only; this job validates configuration and starts no services.
          COLLECTOR_SERVICE_TOKEN: ci-compose-validation-token-0123456789abcdef0123456789abcdef
        run: docker compose -f docker-compose.full.yml config
